# Use the hosted Sanity Studio for content management.
[[redirects]]
  from = "/admin"
  to = "https://danecoleanderson.sanity.studio/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://danecoleanderson.sanity.studio/"
  status = 302
  force = true

# Handle SPA routes - redirect all unknown paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Asset caching
[[headers]]
  # Define which paths this specific headers block applies to
  for = "/assets/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Define which paths this specific headers block applies to
  for = "/*"
    [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
