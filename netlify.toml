
# Netlify configuration file

[build]
  # Directory to publish
  publish = "dist"
  # Build command
  command = "npm run build"
  # Environment variables
  environment = { NETLIFY_USE_YARN = "false", NODE_VERSION = "18.17.0", NPM_FLAGS = "--legacy-peer-deps" }

# ---------------------------------------------------------------------------
# Old Humanities Last Chance domains (aliases on this Netlify project).
# Netlify uses the first matching rule, so the order is: plain HTTP to HTTPS
# on the same host, then specific old pages to their new equivalents, then a
# catch-all to the new homepage. All are permanent (301).
# ---------------------------------------------------------------------------

[[redirects]]
  from = "http://humanitieslastchance.org/*"
  to = "https://humanitieslastchance.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.humanitieslastchance.org/*"
  to = "https://www.humanitieslastchance.org/:splat"
  status = 301
  force = true

